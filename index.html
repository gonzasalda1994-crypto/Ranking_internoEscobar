<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ranking Interno - Círculo de Ajedrez de Escobar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/estilos.css">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <div class="text-center mb-5">

        <h1>♟ Ranking Interno</h1>

        <h3>Círculo de Ajedrez de Escobar</h3>

    </div>

    <div class="text-center mb-4">

        <button class="btn btn-warning me-2" onclick="cargarRanking('clasico')">
            ♟ Clásico
        </button>

        <button class="btn btn-secondary me-2" onclick="cargarRanking('blitz')">
            ⚡ Blitz
        </button>

        <button class="btn btn-info" onclick="cargarRanking('rapid')">
            🚀 Rapid
        </button>

    </div>

    <div class="mb-3">

        <input
            type="text"
            id="buscar"
            class="form-control"
            placeholder="Buscar jugador..."
            onkeyup="filtrar()">

    </div>

    <table class="table table-dark table-hover table-striped">

        <thead>

            <tr>

                <th>#</th>

                <th>Jugador</th>

                <th>ELO</th>

            </tr>

        </thead>

        <tbody id="tablaRanking">

        </tbody>

    </table>

</div>

<script src="js/app.js"></script>

</body>

</html>
